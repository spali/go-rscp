version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused

  # don't enable:
  # - whitespace
  # - asciicheck
  # - gochecknoglobals
  # - gocognit
  # - godot
  # - godox
  # - err113
  # - nestif
  # - prealloc
  # - testpackage
  # - wsl

  settings:
    lll:
      line-length: 140
    depguard:
      rules:
        main:
          files:
            - "$all"
            - "!$test"
          allow:
            - "$gostd"
            - github.com/
        tests:
          files:
            - "$test"
          allow:
            - "$gostd"
            - github.com/

  exclusions:
    generated: lax
    # keep the v1 default exclusions
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - funlen
          - goconst
          - lll
      # enforce ALL_CAPS constant naming for tags
      - path: rscp/tag.go
        linters:
          - revive
        text: "var-naming: don't use ALL_CAPS in Go names; use CamelCase"
      # enforce ALL_CAPS constant naming for tags
      - path: rscp/tag.go
        linters:
          - staticcheck
        text: "ST1003: should not use ALL_CAPS in Go names; use CamelCase instead"

formatters:
  enable:
    - gofmt
    - goimports
