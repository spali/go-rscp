name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-.*"

permissions:
  contents: read

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the archives
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
      artifact-metadata: write # create the artifact storage record
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # See: https://goreleaser.com/ci/actions/
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Create release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --config .github/goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
