# Shared release flow, see https://github.com/spali/.github
# prepare (shared) -> build (goreleaser in snapshot mode, version from prepare) -> publish (shared).
# .github/goreleaser.yml only builds: no checksums, the shared workflow writes checksums.txt.
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      - "!v*-next"
      - "!v*-pr.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exception version for the draft, only on main (e.g. 2.0.0-rc.1). Empty: computed from the labels."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    permissions:
      contents: write # update the draft release
      pull-requests: read
      actions: read # the tag check waits for the run on main
    uses: spali/.github/.github/workflows/release-prepare.yml@43a6be5e4555429445c7b94f2a2a1d78ea951ee8 # v1.1.0
    with:
      version: ${{ inputs.version }}

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0 # See: https://goreleaser.com/ci/actions/
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --config .github/goreleaser.yml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    permissions:
      contents: write # create and edit releases
      pull-requests: write # comment the dev build link
      id-token: write # sign the attestation
      attestations: write # store the attestation
      artifact-metadata: write # create the artifact storage record
    uses: spali/.github/.github/workflows/release-publish.yml@43a6be5e4555429445c7b94f2a2a1d78ea951ee8 # v1.1.0
    with:
      kind: ${{ needs.prepare.outputs.kind }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      sha: ${{ needs.prepare.outputs.sha }}
      pr: ${{ needs.prepare.outputs.pr }}
      draft-id: ${{ needs.prepare.outputs.draft-id }}
