name: CodeQL

on:
  push:
    branches:
      - main
      - build/*
  pull_request:
    branches:
      - main
  schedule:
    - cron: "41 10 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Install the Go version from go.mod, so CodeQL builds with the same
      # toolchain as the build workflow instead of the runner's preinstalled Go.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Initialize
        uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Analysis
        uses: github/codeql-action/analyze@v4
